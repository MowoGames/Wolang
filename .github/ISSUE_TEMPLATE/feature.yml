name: Feature
description: Something the language or a library should be able to do
labels: ["feature"]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to write
      description: The code you wish worked, as you would like to write it.
      render: wolang
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you write today instead
      render: wolang
  - type: textarea
    id: why
    attributes:
      label: Why it belongs in the language rather than in a library
      description: |
        Most things belong in a library. What makes this one different?
    validations:
      required: true
