# What has to be true of every commit.
#
# Three machines, because the compiler has three answers that have to
# agree: the interpreter, the ARM64 tier and the x86-64 tier. A laptop
# can only check two of them, which is the whole reason this file exists
# (D131).

name: ci

on:
  push:
    branches: [main, alpha]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            preset: debug
          - name: linux-x86_64-release
            os: ubuntu-24.04
            preset: release
          # The other machine this language claims to run on, and the one
          # a laptop cannot check: same architecture as macOS, different
          # system (D157).
          - name: linux-arm64
            os: ubuntu-24.04-arm
            preset: debug
          - name: macos-arm64
            os: macos-14
            preset: debug
          - name: macos-arm64-asan
            os: macos-14
            preset: asan

    steps:
      - uses: actions/checkout@v4

      - name: Install ninja, and what a window is made of
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            # clang, because that is what this project is built with
            # (D184); X11 for the window backend, without which the
            # build is the one that says there is no backend.
            sudo apt-get install -y ninja-build clang lld libx11-dev
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          else
            brew install ninja
          fi

      # The ahead-of-time backend is optional, and the build says so when
      # it is missing: a machine with no LLVM still builds everything the
      # tests need.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }}

      - name: Library tests
        run: |
          W=build/${{ matrix.preset }}/tools/wolang/wolang
          $W test lib/std
          $W test lib/http
          $W test lib/game
          $W test lib/core
          # `gfx` without a display: every drawing test runs, and the one
          # that asks which backend this is answers "none" (D155).
          $W test lib/gfx

      # The differential fuzzer: the same program through every tier, and
      # any disagreement is a miscompilation. The one test that has found
      # more bugs than the rest of the suite put together.
      - name: Fuzz the tiers against each other
        run: |
          W=build/${{ matrix.preset }}/tools/wolang/wolang
          $W fuzz --seed ${{ github.run_number }} --count 200

      - name: Examples
        run: |
          W=build/${{ matrix.preset }}/tools/wolang/wolang
          $W check examples/server examples/systems examples/package
          $W check examples/embed/script examples/window
          $W run examples/hello.wo

      # `errors.wo` and `recovery.wo` do not parse, on purpose.
      - name: Formatting
        if: matrix.preset == 'debug'
        run: |
          W=build/${{ matrix.preset }}/tools/wolang/wolang
          $W fmt --check lib benchmarks examples/*/ \
            $(ls examples/*.wo | grep -v -e errors.wo -e recovery.wo)

      - name: Every file says what it includes
        if: matrix.preset == 'debug'
        run: python3 tools/package/check_includes.py

      - name: The examples in the documentation compile
        if: matrix.preset == 'debug'
        run: python3 tools/package/check_docs.py

      - name: The editor extension packages
        if: matrix.preset == 'debug'
        run: python3 tools/package/make_vsix.py

      - name: Documentation is current
        if: matrix.preset == 'debug'
        run: |
          W=build/${{ matrix.preset }}/tools/wolang/wolang
          for package in std http game core; do
            $W doc lib/$package -o /tmp/api-$package.md
            test -s /tmp/api-$package.md
          done

  # Windows builds and runs here and nowhere else: a laptop cannot check
  # it, and a port nobody runs is a port that does not work (D159).
  windows:
    name: windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # clang-cl, with Microsoft's headers and libraries behind it: the
      # compiler is clang and the system is Windows (D184).
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install ninja and LLVM
        run: |
          choco install ninja --no-progress -y
          choco install llvm --no-progress -y
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Configure
        run: cmake --preset windows
      - name: Build
        run: cmake --build --preset windows -j
      - name: Unit tests
        run: ctest --preset windows
      - name: Library tests
        shell: bash
        run: |
          W=build/windows/tools/wolang/wolang.exe
          $W test lib/std
          $W test lib/http
          $W test lib/core
          $W test lib/gfx
      - name: Fuzz the tiers against each other
        shell: bash
        run: |
          W=build/windows/tools/wolang/wolang.exe
          $W fuzz --seed ${{ github.run_number }} --count 100
      - name: A program that runs
        shell: bash
        run: |
          W=build/windows/tools/wolang/wolang.exe
          $W run examples/hello.wo
          $W check examples/server examples/systems examples/package
          $W check examples/embed/script examples/window
      - name: Formatting, includes and documentation
        shell: bash
        run: |
          W=build/windows/tools/wolang/wolang.exe
          $W test lib/game
          $W fmt --check lib benchmarks examples/*/ \
            $(ls examples/*.wo | grep -v -e errors.wo -e recovery.wo)
          python tools/package/check_includes.py
          python tools/package/check_docs.py
      - name: The C host links against the DLL
        shell: bash
        run: |
          clang-cl -nologo -Iinclude examples/embed/host.c -Fehost.exe \
            -link build/windows/src/wolang_embed_dll.lib
          PATH="$PWD/build/windows/src:$PATH" ./host.exe examples/embed/script

  embed:
    name: embed the language in C
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure and build
        run: |
          cmake --preset debug
          cmake --build --preset debug -j
      # A host that links the library and calls a script: the thing an
      # embedding API has to actually do (D128).
      - name: Build and run the C host
        run: |
          cc -I include examples/embed/host.c -L build/debug/src \
             -Wl,-rpath,"$PWD/build/debug/src" -lwolang_embed -lstdc++ \
             -o /tmp/host
          /tmp/host examples/embed/script

      # And the way a host with no build system gets it: two files
      # (D186).
      - name: The amalgamation builds and runs
        run: |
          python3 tools/package/make_amalgamation.py --out /tmp/amalg
          cd /tmp/amalg
          c++ -std=c++20 -fno-exceptions -fno-rtti -O1 \
              -c wolang_amalgamation.cc -o wolang.o
          cat > host.cc <<'EOT'
          #include <stdio.h>
          #include "wolang.h"
          int main(void) {
            WolangVm* vm = wolang_vm_create();
            if (wolang_vm_load_source(
                    vm, "host.wo",
                    "offer fun Add(a: int, b: int) -> int => a + b\n")
                != 0) {
              fprintf(stderr, "%s", wolang_vm_errors(vm));
              return 1;
            }
            WolangValue args[2] = {wolang_int(2), wolang_int(40)};
            WolangValue out;
            if (wolang_vm_call(vm, "Add", args, 2, &out) != 0) {
              return 1;
            }
            printf("%lld\n", (long long)out.integer);
            wolang_vm_destroy(vm);
            return 0;
          }
          EOT
          c++ -std=c++20 -O1 host.cc wolang.o -o host
          test "$(./host)" = "42"

      # And the way a host actually gets it: installed, then found.
      - name: Install and link through find_package
        run: |
          cmake --install build/debug --prefix /tmp/wolang
          mkdir -p /tmp/hostproj
          cp examples/embed/host.cpp /tmp/hostproj/
          cat > /tmp/hostproj/CMakeLists.txt <<'EOT'
          cmake_minimum_required(VERSION 3.24)
          project(host LANGUAGES CXX)
          find_package(Wolang CONFIG REQUIRED)
          add_executable(host host.cpp)
          target_link_libraries(host PRIVATE Wolang::embed)
          target_compile_features(host PRIVATE cxx_std_20)
          EOT
          cmake -S /tmp/hostproj -B /tmp/hostproj/build \
                -DCMAKE_PREFIX_PATH=/tmp/wolang
          cmake --build /tmp/hostproj/build -j
          /tmp/hostproj/build/host

  # Discord #wolang-ci and the Telegram topic Wolang CI: ci failed on main or alpha. Green runs say nothing —
  # that is noise.
  # Secrets DISCORD_WEBHOOK_URL and TELEGRAM_BOT_TOKEN; without them nothing is sent, and a
  # message that cannot be sent never fails the job (.github/notify.sh).
  failed:
    needs: [build, windows, embed]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004491648622"
          TELEGRAM_THREAD_ID: "15"
          COMMIT_TITLE: ${{ github.event.head_commit.message }}
        run: |
          . .github/notify.sh
          notify "$NOTIFY_RED" "❌ CI failed on $GITHUB_REF_NAME" "A build or a test did not pass on one of the machines — the run shows which.

          > ${COMMIT_TITLE%%$'\n'*}"
