# What a release is: a binary per platform, the standard library beside
# it, and an archive a person can unpack and use.
#
# Triggered by a tag, so that making a release is pushing one.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v"
        required: true

jobs:
  artifacts:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wolang-linux-x86_64
            os: ubuntu-24.04
          - name: wolang-macos-arm64
            os: macos-14
          - name: wolang-macos-x86_64
            os: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build
          else
            brew install ninja
          fi

      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release -j

      - name: Check it runs
        run: |
          build/release/tools/wolang/wolang --version
          build/release/tools/wolang/wolang test lib/std

      # The whole thing, laid out by `cmake --install`: the compiler, the
      # libraries, the embedding headers, the CMake package and the
      # pkg-config file. Which is the same layout `wolang new` and
      # `find_package(Wolang)` look for (D132, D137).
      - name: Assemble
        shell: bash
        run: |
          out="${{ matrix.name }}"
          cmake --install build/release --prefix "$PWD/$out"
          cp README.md "$out/" || true
          cp LICENSE "$out/" 2>/dev/null || true
          cp docs/embedding.md "$out/" || true
          tar -czf "$out.tar.gz" "$out"

      # And the embedding API on its own, for a host that wants the
      # library and the headers and not a compiler.
      - name: Assemble the embedding package
        shell: bash
        run: |
          out="wolang-embed-${{ matrix.name }}"
          out="${out#wolang-embed-wolang-}"
          out="wolang-embed-$out"
          mkdir -p "$out"
          cp -R "${{ matrix.name }}/include" "$out/"
          mkdir -p "$out/lib"
          cp -R "${{ matrix.name }}/lib/cmake" "$out/lib/" || true
          cp -R "${{ matrix.name }}/lib/pkgconfig" "$out/lib/" || true
          cp -R "${{ matrix.name }}"/lib/std "${{ matrix.name }}"/lib/http \
                "${{ matrix.name }}"/lib/game "${{ matrix.name }}"/lib/core \
                "$out/lib/" || true
          cp "${{ matrix.name }}"/lib/libwolang_* "$out/lib/" || true
          cp docs/embedding.md "$out/README.md" || true
          tar -czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            wolang-embed-*.tar.gz

  publish:
    needs: artifacts
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
