# What a release is: a binary per platform, the standard library beside
# it, and an archive a person can unpack and use.
#
# Triggered by a tag, so that making a release is pushing one.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v"
        required: true

# Nothing here writes to the repository except `publish`, which says so.
permissions:
  contents: read

jobs:
  # First, and cheap: a tag that does not match the source is a release
  # that would say one version and be another, so stop before 20 minutes
  # of building (D248).
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version in CMakeLists.txt
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: python3 tools/package/check_version.py --tag "$TAG"

  artifacts:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wolang-linux-x86_64
            os: ubuntu-24.04
          - name: wolang-linux-arm64
            os: ubuntu-24.04-arm
          - name: wolang-macos-arm64
            os: macos-14
          - name: wolang-macos-x86_64
            os: macos-13
          - name: wolang-windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # clang everywhere, because that is what this project is built
      # with -- clang-cl on Windows (D184).
      - name: Install what the build needs
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build clang lld libx11-dev
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ninja
          else
            choco install ninja llvm --no-progress -y
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # The release carries the ahead-of-time back end, so `wolang build`
      # works: the same pinned LLVM 22 that ci.yml's `aot` jobs use (23
      # miscompiles a remainder, D208).
      - name: Cache the LLVM packages
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: llvm-22.1.8-${{ matrix.os }}

      - name: Install LLVM 22
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
            chmod +x /tmp/llvm.sh
            sudo /tmp/llvm.sh 22
            sudo apt-get install -y llvm-22-dev
            echo "CMAKE_PREFIX_PATH=/usr/lib/llvm-22" >> $GITHUB_ENV
          else
            brew install llvm@22
            echo "CMAKE_PREFIX_PATH=$(brew --prefix llvm@22)" >> $GITHUB_ENV
          fi

      # Windows has no package for it: LLVM 22.1.8's C API, fetched by
      # script and kept between runs (D208).
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.14"
      - name: Cache the LLVM SDK
        if: runner.os == 'Windows'
        id: llvm-sdk
        uses: actions/cache@v4
        with:
          path: build/llvm-sdk
          key: llvm-sdk-22.1.8-windows-x86_64
      - name: Fetch the LLVM SDK
        if: runner.os == 'Windows' && steps.llvm-sdk.outputs.cache-hit != 'true'
        run: python tools/package/fetch_llvm.py --version 22.1.8

      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --preset windows -DCMAKE_BUILD_TYPE=Release
            cmake --build --preset windows -j
            echo "WOLANG_BUILD=windows" >> $GITHUB_ENV
          else
            cmake --preset release
            cmake --build --preset release -j
            echo "WOLANG_BUILD=release" >> $GITHUB_ENV
          fi

      - name: Check it runs
        shell: bash
        run: |
          W="build/$WOLANG_BUILD/tools/wolang/wolang"
          [ "$RUNNER_OS" = "Windows" ] && W="$W.exe"
          "$W" --version
          "$W" test lib/std
          # Built without the back end this would say so, and a release
          # that cannot `build` is not the release that was promised.
          exe=hello
          [ "$RUNNER_OS" = "Windows" ] && exe=hello.exe
          "$W" build examples/hello.wo -o "$RUNNER_TEMP/$exe"
          "$RUNNER_TEMP/$exe"

      # The whole thing, laid out by `cmake --install`: the compiler, the
      # libraries, the embedding headers, the CMake package and the
      # pkg-config file. Which is the same layout `wolang new` and
      # `find_package(Wolang)` look for (D132, D137).
      - name: Assemble
        shell: bash
        run: |
          out="${{ matrix.name }}"
          cmake --install "build/$WOLANG_BUILD" --prefix "$PWD/$out"
          cp README.md LICENSE NOTICE "$out/" 2>/dev/null || true
          cp docs/embedding.md docs/install.md "$out/" || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$out.zip" "$out" > /dev/null
            sha256sum "$out.zip" > "$out.zip.sha256"
          else
            tar -czf "$out.tar.gz" "$out"
            if command -v sha256sum > /dev/null; then
              sha256sum "$out.tar.gz" > "$out.tar.gz.sha256"
            else
              shasum -a 256 "$out.tar.gz" > "$out.tar.gz.sha256"
            fi
          fi

      # And the embedding API on its own, for a host that wants the
      # library and the headers and not a compiler.
      - name: Assemble the embedding package
        shell: bash
        run: |
          out="wolang-embed-${{ matrix.name }}"
          out="${out#wolang-embed-wolang-}"
          out="wolang-embed-$out"
          mkdir -p "$out"
          cp -R "${{ matrix.name }}/include" "$out/"
          mkdir -p "$out/lib"
          cp -R "${{ matrix.name }}/lib/cmake" "$out/lib/" || true
          cp -R "${{ matrix.name }}/lib/pkgconfig" "$out/lib/" || true
          cp -R "${{ matrix.name }}"/lib/std "${{ matrix.name }}"/lib/http \
                "${{ matrix.name }}"/lib/game "${{ matrix.name }}"/lib/core \
                "$out/lib/" || true
          cp "${{ matrix.name }}"/lib/libwolang_* "$out/lib/" || true
          cp docs/embedding.md "$out/README.md" || true
          tar -czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.*.sha256
            wolang-embed-*.tar.gz

  # The Windows installer: a real `.msi`, with the PATH entry and an
  # Add/Remove Programs record (D188).
  msi:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Cache the LLVM SDK
        id: llvm-sdk
        uses: actions/cache@v4
        with:
          path: build/llvm-sdk
          key: llvm-sdk-22.1.8-windows-x86_64
      - name: Install what it takes
        run: |
          choco install ninja llvm --no-progress -y
          dotnet tool install --global wix
          wix extension add -g WixToolset.UI.wixext
      - name: Fetch the LLVM SDK
        if: steps.llvm-sdk.outputs.cache-hit != 'true'
        run: python tools/package/fetch_llvm.py --version 22.1.8
      - name: Build
        run: |
          cmake --preset windows -DCMAKE_BUILD_TYPE=Release
          cmake --build --preset windows -j
      - name: Package
        run: pwsh tools/package/make_msi.ps1 -Build build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: "build/*.msi"

  # The editor extension, which needs no compiler to build (D175).
  extension:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/package/make_vsix.py --out .
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: "*.vsix"

  publish:
    needs: [artifacts, extension, msi]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The notes are the CHANGELOG section for this version; GitHub's
      # generated notes (the merged pull requests) are added after them,
      # and are all there is if the section is missing (D248).
      - name: Release notes from CHANGELOG.md
        run: |
          version="$(python3 tools/package/check_version.py --print)"
          python3 tools/package/release_notes.py "$version" > notes.md ||
            echo "No CHANGELOG section for $version." > notes.md
      # One file of checksums, which is what the install scripts read.
      - name: Gather the checksums
        run: |
          cat artifacts/**/*.sha256 | sed 's|.*/||' > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.vsix
            artifacts/**/*.msi
            SHA256SUMS
          body_path: notes.md
          generate_release_notes: true

  # The release as a user gets it: the install scripts, from the tagged
  # checkout, pinned to this version, on each system they claim to run on.
  # A script that cannot install what was just published is a broken
  # release (D248).
  smoke:
    name: install on ${{ matrix.os }}
    needs: publish
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          v="$(python3 tools/package/check_version.py --print)"
          sh install.sh --version "$v" --prefix "$RUNNER_TEMP/w" --no-modify-path
          W="$RUNNER_TEMP/w/bin/wolang"
          test "$("$W" --version)" = "wolang $v"
          "$W" run examples/hello.wo
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $v = python tools/package/check_version.py --print
          ./install.ps1 -Version $v -Prefix "$env:RUNNER_TEMP\w" -NoModifyPath
          $w = "$env:RUNNER_TEMP\w\current\bin\wolang.exe"
          if ((& $w --version) -ne "wolang $v") { throw "wrong version" }
          & $w run examples/hello.wo
          if ($LASTEXITCODE -ne 0) { throw "hello failed" }

  # Discord #wolang-ci and the Telegram topic Wolang CI: the release was published, or it was not.
  # Secrets DISCORD_WEBHOOK_URL and TELEGRAM_BOT_TOKEN; without them nothing is sent, and a
  # message that cannot be sent never fails the job (.github/notify.sh).
  notify:
    needs: [artifacts, msi, extension, publish, smoke]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # actions: read lets notify.sh list the run's jobs with their results and links
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004491648622"
          TELEGRAM_THREAD_ID: "15"
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ needs.publish.result }}
        run: |
          . .github/notify.sh
          if [ "$PUBLISHED" = success ]; then
            notify "$NOTIFY_GREEN" "📦 Wolang $GITHUB_REF_NAME is published" "The binaries, the installer and the editor extension are on the **GitHub release**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          else
            notify "$NOTIFY_RED" "❌ Release $GITHUB_REF_NAME was not published" "A platform build, the installer or the extension did not pass, so nothing was released — the run shows which."
          fi

  # Discord #wolang-changelog and the Telegram topic Wolang Changelog (and the group's General
  # topic): the commits since the previous tag (.github/changelog.py). Never fails the release.
  changelog:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/changelog.py tag --from "$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGELOG_WEBHOOK_URL: ${{ secrets.CHANGELOG_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004491648622"
          TELEGRAM_THREAD_ID: "17"
          TELEGRAM_GLOBAL_THREAD_ID: "1"
