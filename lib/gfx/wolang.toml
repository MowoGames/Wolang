[package]
name = "gfx"
source = "src"

[dependencies]
std = { path = "../std" }

# The window, GPU and sound library, which ships beside the compiler
# rather than inside it (D155). The build directory comes first so that a
# checkout tests what it just built, and the installed one is what a
# program on another machine finds.
[link]
libraries = "wolang_platform"
paths = "../../build/debug/platform, ../../build/release/platform, ../../build/x64/platform, ../../build/asan/platform, ../../build/windows/platform, /usr/local/lib, /usr/lib, /opt/homebrew/lib"
